# Streamlit Cloud -> your app -> Settings -> Secrets  (paste this, fill in YOUR keys)
# Local run: save as .streamlit/secrets.toml

# Which AI to use first: "groq" | "gemini" | "ollama" | "ollama_local"
PROVIDER = "groq"

# Automatic backups, tried in this order if the first one fails (402 / limit / error)
FALLBACK_PROVIDERS = "gemini,ollama"

# --- Groq (free tier)  -> https://console.groq.com  -> API Keys
GROQ_API_KEY = ""
GROQ_MODEL = "openai/gpt-oss-120b"

# --- Google Gemini (free tier) -> https://aistudio.google.com/apikey
GEMINI_API_KEY = ""
GEMINI_MODEL = "gemini-2.5-flash"

# --- Ollama Cloud (your old one, needs credits/plan)
OLLAMA_API_KEY = ""
OLLAMA_MODEL = "gemma4:31b"

# --- Ollama on YOUR OWN PC (free, no limit; only works when the app runs on that same PC)
# PROVIDER = "ollama_local"   then run once:  ollama pull llama3.2
OLLAMA_LOCAL_MODEL = "llama3.2"
